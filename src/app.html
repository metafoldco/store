<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<!-- Coming-soon unit. og:url and og:image must stay absolute — WhatsApp will not
		     resolve a relative preview image. -->
		<title>Metafold — Launching Soon</title>
		<meta
			name="description"
			content="Metafold is launching soon. Precision laser-cut MDF, made in India."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Metafold — Launching Soon" />
		<meta property="og:description" content="Precision laser-cut MDF · Made in India" />
		<meta property="og:url" content="https://metafold.co.in/" />
		<meta property="og:image" content="https://metafold.co.in/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />

		<link
			rel="preload"
			href="/fonts/space-grotesk-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
